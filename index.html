<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Log</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Site Log</h1>
      <p>Sign in and out with a live photo, for inspection records.</p>
    </div>
    <a href="/admin.html">Admin</a>
  </header>

  <a class="option-card" href="/signin.html">
    <div class="option-icon option-icon-in">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 16l-4-4m0 0l4-4m-4 4h12M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="option-body">
      <h3>Sign In</h3>
      <p>Starting your shift — take a photo and check in.</p>
    </div>
  </a>

  <a class="option-card" href="/signout.html">
    <div class="option-icon option-icon-out">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 8l4 4m0 0l-4 4m4-4H5M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="option-body">
      <h3>Sign Out</h3>
      <p>Ending your shift — take a photo and check out.</p>
    </div>
  </a>

  <a class="option-card" href="/dashboard.html">
    <div class="option-icon option-icon-dash">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 19h16M6 15v4M11 10v9M16 6v13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="option-body">
      <h3>My Dashboard</h3>
      <p>View your own sign-in/out history and photos.</p>
    </div>
  </a>
</div>
</body>
</html>
